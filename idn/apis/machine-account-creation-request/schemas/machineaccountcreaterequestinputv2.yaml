type: object
title: Machine Account Create Request Input V2
description: >-
  Machine account create request. `sourceId` is required while tiered subtype configuration is
  enabled and is ignored when that flag is off. `entitlements` is honored while per-entitlement
  request details are enabled. `entitlementIds` is honored while that flag is off. A non-empty
  list of the kind the current flag state does not honor is rejected.
required:
  - subtypeId
  - ownerIdentityId
properties:
  sourceId:
    type: string
    default: ""
    description: >-
      Source the machine account is created on. Required while tiered subtype configuration is
      enabled, so a connector-tier subtype can name its source. Ignored when that flag is off;
      the source is then the subtype's own source.
    example: 2c9180907c1e4b3a017c1e5f2a3b0001
  subtypeId:
    type: string
    description: >-
      Subtype that must be in the source effective set and for which the caller holds the create
      machine account entitlement.
    example: 1419fc28-a8ed-4a07-9f5c-0cb5dfad6311
  formId:
    type: string
    default: ""
    description: Form selected for the machine account create request.
    example: 4f1bb61b-a0ab-4c0a-b9fb-20f44407b75a
  ownerIdentityId:
    type: string
    description: Identity assigned as owner of the created machine account.
    example: 9f2c1b7e4a6d4c8fa1b2c3d4e5f60718
  machineIdentityId:
    type: string
    nullable: true
    default: null
    description: >-
      Machine identity to correlate with the created machine account. When omitted, a new machine
      identity is created.
    example: b1e2c3d4-0a5b-4c6d-8e7f-9a0b1c2d3e4f
  environment:
    type: string
    default: ""
    description: Environment type to use for the machine account.
    example: production
  description:
    type: string
    default: ""
    description: Description for the machine account.
    example: Nightly reconciliation job
  userInput:
    type: object
    default: {}
    description: Fields of the form linked to the subtype in approval settings.
    example:
      accountName: svc-recon-01
  entitlements:
    type: array
    default: []
    description: >-
      Entitlements to provision, including an optional comment and access dates. Honored while
      per-entitlement request details are enabled. De-duplicated by `id` (first occurrence wins),
      at most 20 unique ids. A non-empty array is rejected when that flag is off. An empty array
      is accepted.
    items:
      $ref: ./machineaccountcreateentitlement.yaml
    example:
      - id: 858d2151-ff19-464b-ae0d-6938b3af2baf
        comment: Needed to read the reconciliation staging tables.
        startDate: '2026-09-01T00:00:00.000Z'
        removeDate: '2027-03-01T00:00:00.000Z'
      - id: 0c7a44b9-3e21-4f88-9a10-77bd2c6e5f31
  entitlementIds:
    type: array
    default: []
    description: >-
      Entitlement ids to provision. Honored while per-entitlement request details are off.
      Values are trimmed, blanks are dropped, and ids are de-duplicated (first occurrence wins),
      at most 20 unique ids. A non-empty array is rejected when per-entitlement request details
      are enabled. An empty array is accepted.
    items:
      type: string
    example:
      - 858d2151-ff19-464b-ae0d-6938b3af2baf
      - 0c7a44b9-3e21-4f88-9a10-77bd2c6e5f31
