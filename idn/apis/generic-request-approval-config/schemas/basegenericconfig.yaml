title: Base Generic Config
description: >-
  Per-action approval configuration. An empty object means no configuration at this scope and is
  not persisted. At submit, RESOURCE is used first, then GLOBAL, then org-level agent request
  configuration. A non-empty object is either generic (`scheme: APPROVAL`) or adaptive
  (`scheme: WORKFLOW`).
oneOf:
  - type: object
    title: Inherit Broader Config
    description: >-
      Empty object. No configuration at this scope. Submit uses RESOURCE, then GLOBAL, then
      org-level agent request configuration. Not persisted.
    additionalProperties: false
  - $ref: ./genericapprovalconfig.yaml
  - $ref: ./adaptiveapprovalconfig.yaml
