type: object
title: Generic Request Approval Config
description: >-
  Approval configuration for one scope. sourceId is never returned. approvalConfig always contains
  every action allowed for targetType. Unset actions are empty objects (no config at this scope).
  Submit uses RESOURCE, then GLOBAL, then org-level agent request configuration. There is no
  approvalRequired flag.
required:
  - id
  - targetType
  - targetId
  - approvalConfig
properties:
  id:
    type: string
    format: uuid
    description: Stable identifier for this scope. Use this value on PATCH. Created on first GET if the scope was never configured.
    example: f0948adc-06f7-435b-a8fd-a06861012470
  targetType:
    $ref: ./genericrequesttargettype.yaml
  targetId:
    type: string
    description: >-
      Connector resource id for RESOURCE (for example aws:bedrock-agent-alias-version). Derived
      tenant id for GLOBAL. Not patchable.
    example: aws:bedrock-agent-alias-version
  approvalConfig:
    type: object
    description: >-
      Map keyed by action name. RESOURCE and GLOBAL emit ACTIVATE and DEACTIVATE. DELETE_AT_SOURCE
      is not returned and cannot be patched.
    additionalProperties:
      $ref: ./basegenericconfig.yaml
    example:
      ACTIVATE:
        scheme: APPROVAL
        approvers: sourceOwner, manager
        comments: REJECTION
      DEACTIVATE: {}
