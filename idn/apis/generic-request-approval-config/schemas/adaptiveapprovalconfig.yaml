type: object
title: Adaptive Approval Config
description: >-
  Adaptive (`scheme: WORKFLOW`) configuration for one action. The decision is delegated to the
  platform workflow identified by workflowId instead of a generic-approvals serial chain. GLOBAL
  writes accept this scheme only.
required:
  - scheme
  - workflowId
properties:
  scheme:
    type: string
    enum:
      - WORKFLOW
    description: Discriminator. Must be WORKFLOW for adaptive platform-workflow approval.
    example: WORKFLOW
  workflowId:
    type: string
    format: uuid
    description: Identifier of the platform workflow that decides the request.
    example: 8c190e67-2a90-4c2a-9f1e-1c5d0b6a4e21
