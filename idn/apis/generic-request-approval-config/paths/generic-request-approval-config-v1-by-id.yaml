patch:
  operationId: patchGenericRequestApprovalConfigV1
  tags:
  - Generic Request Approval Config
  summary: Patch generic request approval config
  description: |
    Updates stored approval configuration with an RFC 6902 JSON Patch.

    Patchable paths are `/approvalConfig` and `/approvalConfig/{ACTION}` for each action
    in the row's `targetType` vocabulary. For RESOURCE and GLOBAL those actions are
    `ACTIVATE` and `DEACTIVATE`.

    `id`, `targetType`, `targetId`, and `sourceId` are not patchable.
    `/approvalConfig/DELETE_AT_SOURCE` is rejected with **400**.

    Replace an action with `{}` (or remove it) to clear this scope. Submit then uses RESOURCE,
    then GLOBAL, then org-level agent request configuration. Empty action objects are not persisted.

    Allowed approver tokens for RESOURCE ACTIVATE and DEACTIVATE:
    `sourceOwner`, `manager`, `machineIdentityPrimaryOwner`,
    `machineIdentitySecondaryOwners`, `machineIdentityAllOwners`,
    `workgroup:[workgroupId]`, `identity:[identityId]`.
    `accountOwner` is not allowed on those actions. Role tokens may appear once.
    `workgroup:` and `identity:` may repeat with distinct ids.

    GLOBAL writes accept `scheme: WORKFLOW` only.
    Unknown `id` returns **404**.
  security:
  - userAuth:
    - idn:generic-request-approval-config:update
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
    description: Config id returned by GET.
    example: f0948adc-06f7-435b-a8fd-a06861012470
    x-sailpoint-resource-operation-id: getGenericRequestApprovalConfigV1
  requestBody:
    required: true
    description: JSON Patch document used to update approvalConfig.
    content:
      application/json-patch+json:
        schema:
          type: array
          items:
            $ref: ../../shared/schemas/jsonpatchoperation.yaml
        example:
        - op: replace
          path: /approvalConfig/ACTIVATE
          value:
            scheme: APPROVAL
            approvers: sourceOwner, manager
            comments: REJECTION
        - op: replace
          path: /approvalConfig/DEACTIVATE
          value: {}
      application/json:
        schema:
          type: array
          items:
            $ref: ../../shared/schemas/jsonpatchoperation.yaml
  responses:
    '200':
      description: Full document after the patch, same shape as GET.
      content:
        application/json:
          schema:
            $ref: ../schemas/genericrequestapprovalconfig.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
