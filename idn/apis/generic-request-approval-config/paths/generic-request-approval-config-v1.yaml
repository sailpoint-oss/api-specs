get:
  operationId: getGenericRequestApprovalConfigV1
  tags:
  - Generic Request Approval Config
  summary: Get generic request approval config
  description: |
    Returns the approval configuration document for one scope.

    Scope rules for Phase II agent requests:

    | targetType | Allowed actions | targetId | sourceId |
    |------------|-----------------|----------|----------|
    | RESOURCE | ACTIVATE, DEACTIVATE | Required. Connector resource **id**, not the `std:*` type. Resolved resource type must be `std:agent`. | Required |
    | GLOBAL | ACTIVATE, DEACTIVATE | Derived (tenant id). Omit. | Must be omitted |

    `DELETE_AT_SOURCE` is not returned and cannot be configured on this API.

    A scope that has never been saved still returns **200**. Every allowed action is
    present. Unset actions are `{}` (no config at this scope; submit uses RESOURCE, then GLOBAL,
    then org-level). The first successful GET
    materializes a row so the response `id` can be used on PATCH.

    Unknown source, missing or invalid query params, a RESOURCE `targetId` the source
    does not advertise, or a resource whose type is not `std:agent` return **400**.
    Product not licensed returns **404**. Flag off, missing experimental header, or
    insufficient rights return **403**.
  security:
  - userAuth:
    - idn:generic-request-approval-config:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  - name: targetType
    in: query
    required: true
    schema:
      $ref: ../schemas/genericrequesttargettype.yaml
    description: Scope of the configuration document.
    example: RESOURCE
  - name: targetId
    in: query
    required: false
    schema:
      type: string
    description: >-
      Required for RESOURCE and SUBTYPE. Connector resource id for RESOURCE (for example
      `aws:bedrock-agent-alias-version`). Omit for GLOBAL.
    example: aws:bedrock-agent-alias-version
  - name: sourceId
    in: query
    required: false
    schema:
      type: string
    description: Required for RESOURCE, SUBTYPE, and SOURCE. Must be omitted for GLOBAL.
    example: a86e1ab28a844b98b31dbe0ae531d867
  responses:
    '200':
      description: Approval configuration document for the requested scope.
      content:
        application/json:
          schema:
            $ref: ../schemas/genericrequestapprovalconfig.yaml
          example:
            id: f0948adc-06f7-435b-a8fd-a06861012470
            targetType: RESOURCE
            targetId: aws:bedrock-agent-alias-version
            approvalConfig:
              ACTIVATE:
                scheme: APPROVAL
                approvers: sourceOwner, manager
                comments: REJECTION
              DEACTIVATE: {}
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
