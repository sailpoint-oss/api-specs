get:
  summary: List subtype targets
  description: |
    Lists per-target subtype counts. Connector-tier rows are grouped by connector type.
    Source-tier rows are returned 1:1 with each source-tier subtype.

    `filters` must include `targetType eq "CONNECTOR"` or `targetType eq "SOURCE"`. Missing or
    blank `targetType` returns **400**. `CONNECTOR_VARIANT` and unknown values return **400**.
    Filter and sort fields are independent of the subtype list API. Default sort is `targetName`
    ascending. `lastModified` is response-only and is not filterable or sortable.

    When the experimental header is missing, or when the tiered subtype configuration is not enabled
    for the tenant, the endpoint returns **404**.
  operationId: listSourceSubtypeTargetsV2
  tags:
  - Machine Account Subtypes
  parameters:
  - in: query
    name: filters
    required: true
    schema:
      type: string
    description: |-
      Filter results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#filtering-results)

      Filtering is supported for the following fields and operators:

      **targetType**: *eq*

      **targetName**: *eq, sw*
    example: targetType eq "CONNECTOR"
  - in: query
    name: sorters
    schema:
      type: string
      format: comma-separated
      default: targetName
    required: false
    description: |-
      Sort results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)

      Sorting is supported for the following fields: **targetType, targetName, subtypeCount, sourceCount**

      Default sort is targetName ascending.
    example: targetName
  - $ref: ../../shared/parameters/count.yaml
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: "true"
    schema:
      type: string
      default: "true"
    required: true
  responses:
    '200':
      description: List of subtype target summaries.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/subtypetargetsummary.yaml
          examples:
            ConnectorTarget:
              value:
              - targetType: CONNECTOR
                targetId: JDBC
                targetName: JDBC
                subtypeCount: 3
                sourceCount: 12
                lastModified: '2026-08-18T12:00:00.000Z'
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:source-subtypes:read
  - applicationAuth:
    - idn:source-subtypes:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
