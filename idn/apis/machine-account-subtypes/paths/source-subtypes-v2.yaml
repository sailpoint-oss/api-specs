get:
  summary: Retrieve all tiered subtypes
  description: |
    Lists machine account subtypes across SOURCE and CONNECTOR tiers.

    `targetId` is the scope key at every tier (source id for `SOURCE`, connector type for
    `CONNECTOR`). Responses include a resolved `target` reference and do not include `sourceId`.
    List responses do not include `target.supportsProvisioning`.

    With `sourceId`, omitted `effectiveSet` defaults to `true` and returns the effective set for
    that source (SOURCE overrides CONNECTOR by technical name). `effectiveSet=false` returns only
    that source's raw SOURCE-tier rows. `effectiveSet=true` without `sourceId` returns **400**.
    Combining `filters` with effective-set resolution returns **400**. Unknown `sourceId` returns
    **404**. Limit, offset, and `count` apply on both paths. There is no default sort.

    Optional `targetType` applies only on the effective-set path. `CONNECTOR` keeps inherited
    connector winners. `SOURCE` keeps source-only winners and SOURCE overrides. Omitting it keeps
    the full winner set. A blank, unknown, or `CONNECTOR_VARIANT` value, or any `targetType` when
    `effectiveSet` is `false` or `sourceId` is omitted, returns **400**.

    On the effective set, `origin` is `CONNECTOR` only when a SOURCE winner overrides a CONNECTOR
    parent of the same technical name. Connector-only and source-only winners have `origin=null`.

    `includeConfigs` defaults to `false`. When `true`, each `MACHINE` subtype that has a stored
    machine-account-create config includes slim `config.machineAccountCreate.accountCreateEnabled`.
    A `MACHINE` row with no create config, and every non-`MACHINE` row, omits `config`. The list
    does not return the full machine-config document.

    This API requires the Machine Identity Security product. When the experimental header is
    missing, or when the tiered subtype configuration is not enabled for the tenant, the endpoint
    returns **404**.
  operationId: listSourceSubtypesV2
  tags:
  - Machine Account Subtypes
  parameters:
  - in: query
    name: filters
    required: false
    schema:
      type: string
    description: |-
      Filter results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#filtering-results)

      Filtering is supported for the following fields and operators:

      **id**: *eq, in, sw*

      **displayName**: *eq, sw*

      **technicalName**: *eq, sw*

      **source.id**: *eq, in*

      **targetType**: *eq, in*

      **targetId**: *eq, in*

      **targetName**: *eq, sw*

      **classification**: *eq, in*

      **type**: *eq, in*

      **created**: *gt, ge, lt, le*

      **modified**: *gt, ge, lt, le*

      Filters cannot be combined with the effective set. That combination returns 400.
    example: targetType eq "CONNECTOR"
  - in: query
    name: sorters
    schema:
      type: string
      format: comma-separated
      default: ""
    required: false
    description: |-
      Sort results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)

      Sorting is supported for the following fields: **id, displayName, technicalName, source.id, targetType, targetId, targetName, classification, type, created, modified**

      When omitted, order is unspecified.
    example: displayName
  - in: query
    name: sourceId
    required: false
    schema:
      type: string
      default: ""
    description: >-
      Source scope. When supplied, omitted `effectiveSet` defaults to `true`. Unknown source
      returns **404**. Empty means the parameter was omitted.
    example: 6d0458373bec4b4b80460992b76016da
  - in: query
    name: effectiveSet
    required: false
    schema:
      type: boolean
      default: true
    description: >-
      When `true` with `sourceId`, return the effective subtype set for that source. When `false`
      with `sourceId`, return only that source's raw SOURCE-tier rows. `true` without `sourceId`
      returns **400**. Combining with `filters` returns **400**.
    example: true
  - in: query
    name: targetType
    required: false
    x-sailpoint-lint-ignore:
      schema-optional-properties-must-have-default: Omitted means the full effective set. A default would select one tier.
    schema:
      type: string
      enum:
        - SOURCE
        - CONNECTOR
    description: >-
      Winner-tier cut on the effective set only. `CONNECTOR` returns inherited connector winners.
      `SOURCE` returns source-only winners and SOURCE overrides. Omit it to keep the full winner
      set. Invalid when `effectiveSet` is `false` or `sourceId` is omitted.
    example: SOURCE
  - in: query
    name: includeConfigs
    required: false
    schema:
      type: boolean
      default: false
    description: >-
      When `true`, each `MACHINE` subtype with a stored machine-account-create config includes
      slim `config.machineAccountCreate.accountCreateEnabled`. Default `false` omits `config`.
    example: false
  - $ref: ../../shared/parameters/count.yaml
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: "true"
    schema:
      type: string
      default: "true"
    required: true
  responses:
    '200':
      description: List of tiered machine account subtypes.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/subtypewithtargetandconfig.yaml
          examples:
            ConnectorSubtype:
              value:
              - id: 43bdd144-4b17-4fce-a744-17c7fd3e717b
                technicalName: nonPersonal
                displayName: Non Personal
                description: Machine accounts for JDBC connectors
                type: MACHINE
                targetType: CONNECTOR
                targetId: JDBC
                targetName: JDBC
                classification: MACHINE
                origin: null
                profile: null
                systemManaged: false
                created: '2026-08-18T12:00:00.000Z'
                modified: '2026-08-18T12:00:00.000Z'
                target:
                  type: CONNECTOR
                  id: JDBC
                  name: JDBC
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:source-subtypes:read
  - applicationAuth:
    - idn:source-subtypes:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
post:
  summary: Create a tiered subtype
  description: |
    Creates a machine account subtype at the tier declared on the request body.

    `targetId` is required at every tier. `targetType` defaults to `SOURCE` when omitted. Do not
    supply `id` or `profile`; those fields are response-only. `systemManaged`, `created`,
    `modified`, and `origin` are ignored on input. CONNECTOR `targetName` is optional and is filled
    from the connector's display name.

    SOURCE-tier create requires `idn:source-subtypes:create`. CONNECTOR-tier create requires
    `idn:connector-subtypes:create`. A missing right is returned as **404**, not **403**.
    `CONNECTOR_VARIANT` is not available and returns **400**.

    Duplicate technical name or display name in the same tier scope returns **400**. Exceeding the
    organization subtype limit returns **400**. The create also stores a `CREATE_MACHINE_ACCOUNT`
    provisioning policy from the connector's default account-creation fields.

    When the experimental header is missing, or when the tiered subtype configuration is not enabled
    for the tenant, the endpoint returns **404**.
  operationId: createSourceSubtypeV2
  tags:
  - Machine Account Subtypes
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: "true"
    schema:
      type: string
      default: "true"
    required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/sourcesubtypedtov2.yaml
        examples:
          ConnectorSubtype:
            value:
              targetType: CONNECTOR
              targetId: JDBC
              technicalName: nonPersonal
              displayName: Non Personal
              description: Machine accounts for JDBC connectors
              type: MACHINE
          SourceSubtype:
            value:
              targetType: SOURCE
              targetId: 6d0458373bec4b4b80460992b76016da
              technicalName: privileged
              displayName: Privileged
              description: Elevated service accounts on this source
              type: MACHINE
  responses:
    '201':
      description: Created tiered machine account subtype.
      headers:
        location:
          description: URL of the created subtype.
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: ../schemas/subtypewithtarget.yaml
          examples:
            ConnectorSubtype:
              value:
                id: 43bdd144-4b17-4fce-a744-17c7fd3e717b
                technicalName: nonPersonal
                displayName: Non Personal
                description: Machine accounts for JDBC connectors
                type: MACHINE
                targetType: CONNECTOR
                targetId: JDBC
                targetName: JDBC
                classification: MACHINE
                origin: null
                profile: null
                systemManaged: false
                created: '2026-08-18T12:00:00.000Z'
                modified: '2026-08-18T12:00:00.000Z'
                target:
                  type: CONNECTOR
                  id: JDBC
                  name: JDBC
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:source-subtypes:create
    - idn:connector-subtypes:create
  - applicationAuth:
    - idn:source-subtypes:create
    - idn:connector-subtypes:create
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
